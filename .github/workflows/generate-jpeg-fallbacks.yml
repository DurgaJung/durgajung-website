name: Generate JPEG image fallbacks

on:
  push:
    paths:
      - ".github/workflows/generate-jpeg-fallbacks.yml"
      - "assets/images/**/*.webp"
      - "assets/images/**/*.png"
      - "assets/images/**/*.jpg"
      - "assets/images/**/*.jpeg"
      - "assets/images/**/*.svg"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Pillow
        run: python -m pip install --upgrade pillow

      - name: Generate JPEG fallbacks for WebP images
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          root = Path("assets/images")
          converted = 0

          for src in root.rglob("*.webp"):
              dst = src.with_suffix(".jpg")
              try:
                  with Image.open(src) as im:
                      if im.mode in ("RGBA", "LA"):
                          bg = Image.new("RGB", im.size, "white")
                          alpha = im.getchannel("A")
                          bg.paste(im.convert("RGB"), mask=alpha)
                          out = bg
                      else:
                          out = im.convert("RGB")
                      out.save(dst, "JPEG", quality=91, optimize=True, progressive=True)
                      converted += 1
              except Exception as exc:
                  print(f"Could not convert {src}: {exc}")

          print(f"Generated {converted} JPEG fallbacks")
          PY

      - name: Generate media inventory
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          from datetime import datetime, timezone
          import json

          root = Path("assets/images")
          extensions = {".webp", ".jpg", ".jpeg", ".png", ".svg"}
          items = []

          for path in sorted(p for p in root.rglob("*") if p.is_file() and p.suffix.lower() in extensions):
              rel = path.as_posix()
              suffix = path.suffix.lower()
              width = None
              height = None

              if suffix != ".svg":
                  try:
                      with Image.open(path) as image:
                          width, height = image.size
                  except Exception:
                      pass

              fallback = None
              if suffix == ".webp":
                  candidate = path.with_suffix(".jpg")
                  if candidate.exists():
                      fallback = candidate.as_posix()

              parts = path.relative_to(root).parts
              category = parts[0] if len(parts) > 1 else "general"

              items.append({
                  "path": "/" + rel,
                  "name": path.name,
                  "format": suffix.lstrip(".").upper(),
                  "category": category,
                  "bytes": path.stat().st_size,
                  "width": width,
                  "height": height,
                  "jpeg_fallback": ("/" + fallback) if fallback else None
              })

          payload = {
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "count": len(items),
              "items": items
          }

          out = Path("assets/data/media-index.json")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(f"Indexed {len(items)} media files")
          PY

      - name: Commit generated fallbacks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/**/*.jpg assets/images/*.jpg assets/data/media-index.json || true
          if git diff --cached --quiet; then
            echo "No fallback changes to commit."
          else
            git commit -m "Generate JPEG fallbacks for older Safari and iPad"
            git fetch origin main
            git rebase origin/main
            if ! git push origin HEAD:main; then
              echo "Main changed during conversion; rebasing once more."
              git fetch origin main
              git rebase origin/main
              git push origin HEAD:main
            fi
          fi
