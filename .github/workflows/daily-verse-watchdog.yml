name: Daily Verse Watchdog

on:
  schedule:
    # 06:10 Asia/Bahrain (UTC+3)
    - cron: "10 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  verify-daily-verse:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate today's verse, Bible sources, image and live deployment
        id: verify
        continue-on-error: true
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import re
          import sys
          import urllib.request
          from pathlib import Path
          from zoneinfo import ZoneInfo
          from html import unescape

          errors = []
          today = dt.datetime.now(ZoneInfo("Asia/Bahrain")).date().isoformat()
          data_path = Path("assets/data/verse-of-day.json")
          data = json.loads(data_path.read_text(encoding="utf-8"))

          if data.get("date") != today:
              errors.append(f"JSON date is {data.get('date')!r}; Bahrain date is {today}.")
          if not data.get("ad_date") or not data.get("bs_date"):
              errors.append("AD or BS date is missing.")
          if len(data.get("know_more_nepali", [])) != 2:
              errors.append("Know More must contain exactly two Nepali paragraphs.")
          if len(data.get("know_more_english", [])) != 2:
              errors.append("Know More must contain exactly two English paragraphs.")
          if not data.get("reference") or not data.get("english_reference"):
              errors.append("A Nepali or English verse reference is missing.")
          if data.get("reference") not in data.get("history", []):
              errors.append("Today's reference is missing from history.")

          image_rel = (data.get("image") or "").lstrip("/")
          image_path = Path(image_rel)
          if not image_path.is_file():
              errors.append(f"Image file does not exist: {image_rel}")
          else:
              raw = image_path.read_bytes()
              if len(raw) < 100 or raw[:4] != b"RIFF" or raw[8:12] != b"WEBP":
                  errors.append(f"Image is empty or not a valid WebP: {image_rel}")

          def fetch(url):
              req = urllib.request.Request(url, headers={"User-Agent": "DailyVerseWatchdog/1.0"})
              with urllib.request.urlopen(req, timeout=20) as response:
                  return response.read().decode("utf-8", "replace")

          for key in ("source_url", "english_source_url"):
              url = data.get(key, "")
              expected = data.get("verse" if key == "source_url" else "english_verse", "")
              try:
                  html = fetch(url)
                  plain = unescape(re.sub(r"<[^>]+>", " ", html))
                  plain = re.sub(r"\s+", " ", plain).strip()
                  if expected and expected not in plain:
                      errors.append(f"{key} page does not contain the exact configured verse text.")
              except Exception as exc:
                  errors.append(f"Could not verify Bible source {key}: {exc}")

          base = "https://durgajung.com.np"
          try:
              live = json.loads(fetch(base + "/assets/data/verse-of-day.json"))
              if live.get("date") != today:
                  errors.append(f"Public website JSON is dated {live.get('date')!r}, expected {today}.")
              if live.get("reference") != data.get("reference") or live.get("english_reference") != data.get("english_reference"):
                  errors.append("Public website references do not match the repository.")
              live_image = base + (live.get("image") or "")
              req = urllib.request.Request(live_image, headers={"User-Agent": "DailyVerseWatchdog/1.0"})
              with urllib.request.urlopen(req, timeout=20) as response:
                  image_bytes = response.read()
                  if response.status != 200 or image_bytes[:4] != b"RIFF" or image_bytes[8:12] != b"WEBP":
                      errors.append("Public verse image failed HTTP/WebP validation.")
          except Exception as exc:
              errors.append(f"Public website verification failed: {exc}")

          if errors:
              print("\n".join("- " + e for e in errors))
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
                  out.write("failed=true\n")
              sys.exit(1)

          print(f"Daily Verse verified for {today}: {data['reference']} / {data['english_reference']}")
          PY

      - name: Open or update a visible repair issue if checks fail
        if: steps.verify.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Daily Verse needs repair";
            const body = [
              "The scheduled Daily Verse watchdog detected a stale or broken daily verse.",
              "",
              "Please repair `assets/data/verse-of-day.json`, verify the Bible.com wording and BS date, ensure the referenced WebP is valid, and confirm the public deployment.",
              "",
              "Workflow run: " + context.serverUrl + "/" + context.repo.owner + "/" + context.repo.repo + "/actions/runs/" + context.runId
            ].join("\n");
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", per_page: 100
            });
            const found = existing.data.find(issue => issue.title === title && !issue.pull_request);
            if (found) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: found.number, body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body
              });
            }
