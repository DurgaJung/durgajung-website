 <radialGradient id="sun"><stop stop-color="#fff9d9"/><stop offset="1" stop-color="#f2c978" stop-opacity="0"/></radialGradient>
 <linearGradient id="grape" x2="1" y2="1"><stop stop-color="#80639a"/><stop offset="1" stop-color="#382b59"/></linearGradient>
 <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
