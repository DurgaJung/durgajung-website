<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">The true vine</title><desc id="desc">A sunlit vineyard with a strong vine, green leaves and ripe grape clusters, symbolizing abiding in Christ.</desc>
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#f6dca5"/><stop offset=".58" stop-color="#f7edcf"/><stop offset="1" stop-color="#d6e2bd"/></linearGradient>
