<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Strength, love and self-control</title>
<desc id="desc">A sunrise over mountain ridges, with a cross, a person standing in hope, an open Bible, flowers and a glowing lantern.</desc>
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#142b5a"/><stop offset=".48" stop-color="#b96c67"/><stop offset="1" stop-color="#ffd38a"/></linearGradient>
 <radialGradient id="sun"><stop stop-color="#fff8d8"/><stop offset=".48" stop-color="#ffdf9b"/><stop offset="1" stop-color="#f3a65e" stop-opacity="0"/></radialGradient>
 <linearGradient id="ridge1" x2="0" y2="1"><stop stop-color="#526b91"/><stop offset="1" stop-color="#203e68"/></linearGradient>
 <linearGradient id="ridge2" x2="0" y2="1"><stop stop-color="#304e73"/><stop offset="1" stop-color="#102b50"/></linearGradient>
 <linearGradient id="ground" x2="0" y2="1"><stop stop-color="#294b48"/><stop offset="1" stop-color="#0e282d"/></linearGradient>
 <linearGradient id="wood" x2="1" y2="0"><stop stop-color="#492919"/><stop offset=".5" stop-color="#a66d3b"/><stop offset="1" stop-color="#58331f"/></linearGradient>
 <linearGradient id="pages" x2="0" y2="1"><stop stop-color="#fff8e6"/><stop offset="1" stop-color="#d7bd8d"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="18"/></filter>
 <filter id="shadow"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#06172c" flood-opacity=".45"/></filter>
</defs>
