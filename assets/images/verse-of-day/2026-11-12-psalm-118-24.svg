<g filter="url(#shadow)">
  <rect x="480" y="65" width="665" height="545" rx="26" fill="url(#panel)"/>
  <rect x="510" y="90" width="605" height="86" rx="18" fill="#12346b"/>
  <text x="812" y="128" text-anchor="middle" font-family="Noto Sans Devanagari, Nirmala UI, sans-serif" font-size="31" font-weight="700" fill="#fff">आजको वचन</text>
  <text x="812" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" letter-spacing="3" fill="#f8d45f">VERSE OF THE DAY</text>
  <rect x="650" y="194" width="265" height="46" rx="23" fill="#9f251e"/>
  <text x="782" y="225" text-anchor="middle" font-family="Noto Sans Devanagari, Nirmala UI, sans-serif" font-size="25" font-weight="700" fill="#fff">भजनसंग्रह ११८:२४</text>
  <text x="812" y="300" text-anchor="middle" font-family="Noto Sans Devanagari, Nirmala UI, sans-serif" font-size="35" font-weight="700" fill="#16376f">आजको दिन परमप्रभुले</text>
  <text x="812" y="350" text-anchor="middle" font-family="Noto Sans Devanagari, Nirmala UI, sans-serif" font-size="35" font-weight="700" fill="#16376f">सृजनुभएको हो, यसमा हामी</text>
  <text x="812" y="400" text-anchor="middle" font-family="Noto Sans Devanagari, Nirmala UI, sans-serif" font-size="35" font-weight="700" fill="#b72d26">आनन्दित होऔं र रमाऔं।</text>
  <path d="M570 431H1054" stroke="#d5ae55" stroke-width="2"/>
  <text x="812" y="474" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-style="italic" fill="#18345f">“The Lord has done it this very day;</text>
  <text x="812" y="510" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-style="italic" fill="#18345f">let us rejoice today and be glad.”</text>
  <rect x="690" y="538" width="245" height="43" rx="21" fill="#17386f"/>
  <text x="812" y="567" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#fff">PSALM 118:24 · NIV</text>
