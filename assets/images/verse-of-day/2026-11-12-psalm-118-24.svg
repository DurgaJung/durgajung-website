<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Verse of the Day — Psalm 118:24</title>
<desc id="desc">A sunrise over mountains, a wooden cross, an open Bible, and the Nepali and English text of Psalm 118:24.</desc>
<defs>
  <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#183b78"/><stop offset=".48" stop-color="#f59b62"/><stop offset="1" stop-color="#ffe9b5"/></linearGradient>
  <linearGradient id="sun" x2="0" y2="1"><stop stop-color="#fff8cf"/><stop offset="1" stop-color="#f8a83c"/></linearGradient>
  <linearGradient id="panel" x2="1" y2="1"><stop stop-color="#fffdf7" stop-opacity=".98"/><stop offset="1" stop-color="#fff1d9" stop-opacity=".96"/></linearGradient>
  <linearGradient id="wood" x2="1" y2="0"><stop stop-color="#512b19"/><stop offset=".5" stop-color="#a66a37"/><stop offset="1" stop-color="#5c321d"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#10264b" flood-opacity=".28"/></filter>
</defs>
